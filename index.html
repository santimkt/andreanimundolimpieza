<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Nube → Andreani</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { 
            text-align: center; 
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 150px; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0f0f23;
            color: #fff;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #667eea; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            width: 100%;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-secondary { background: #333; color: #fff; }
        
        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #0f0f23; padding: 12px 8px; text-align: left; font-size: 11px; text-transform: uppercase; color: #888; }
        td { padding: 10px 8px; border-bottom: 1px solid #333; }
        tr:hover td { background: #1e1e3f; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        
        .filters { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-btn {
            padding: 6px 14px;
            border: 1px solid #333;
            border-radius: 20px;
            background: transparent;
            color: #888;
            cursor: pointer;
            font-size: 12px;
        }
        .filter-btn:hover, .filter-btn.active { background: #667eea; border-color: #667eea; color: #fff; }
        
        .selection-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #16213e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 20px;
            display: none;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .selection-bar.visible { display: flex; }
        
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #333;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .status { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            padding: 6px 12px;
            background: #0f0f23;
            border-radius: 20px;
            font-size: 12px;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
        .status-dot.connected { background: #10b981; box-shadow: 0 0 10px #10b981; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #16213e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 20px;
            display: none;
            z-index: 1000;
        }
        .toast.visible { display: block; }
        .toast.success { border-color: #10b981; }
        .toast.error { border-color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Tienda Nube → Andreani</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Sin conectar</span>
            </div>
        </div>

        <!-- Panel Configuración -->
        <div id="configPanel" class="card">
            <h3 style="margin-bottom: 15px;">🔐 Conectar Tienda Nube</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Store ID</label>
                    <input type="text" id="storeId" placeholder="Ej: 7315108">
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Access Token</label>
                    <input type="text" id="accessToken" placeholder="Tu access token">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Peso (grs)</label>
                    <input type="number" id="defaultWeight" value="10001">
                </div>
                <div class="form-group">
                    <label>Alto (cm)</label>
                    <input type="number" id="defaultAlto" value="10">
                </div>
                <div class="form-group">
                    <label>Ancho (cm)</label>
                    <input type="number" id="defaultAncho" value="10">
                </div>
                <div class="form-group">
                    <label>Prof. (cm)</label>
                    <input type="number" id="defaultProfundidad" value="10">
                </div>
            </div>
            <button class="btn btn-primary" id="btnConnect" onclick="conectarTienda()">
                🔌 Conectar y cargar órdenes
            </button>
        </div>

        <!-- Panel Órdenes -->
        <div id="ordersPanel" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
                <h3>📋 Órdenes</h3>
                <div class="filters">
                    <button class="filter-btn active" onclick="filtrar('all')">Todas <span id="countAll">0</span></button>
                    <button class="filter-btn" onclick="filtrar('paid')">Pagadas <span id="countPaid">0</span></button>
                    <button class="filter-btn" onclick="filtrar('pending')">Pendientes <span id="countPending">0</span></button>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Cargando órdenes...
            </div>
            
            <div class="table-container hidden" id="tableContainer">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll" onchange="toggleAll()"></th>
                            <th>Orden</th>
                            <th>Cliente</th>
                            <th>Dirección</th>
                            <th>Estado</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Panel Éxito -->
        <div id="successPanel" class="card hidden" style="text-align: center;">
            <div style="font-size: 60px; margin-bottom: 15px;">✅</div>
            <h2>¡Excel generado!</h2>
            <p style="color: #888; margin: 10px 0 20px;">Listo para subir a pymes.andreani.com</p>
            <button class="btn btn-success" onclick="descargarExcel()" style="margin-bottom: 10px;">
                📥 Descargar Excel
            </button>
            <br>
            <button class="btn btn-secondary" onclick="volver()">← Volver a órdenes</button>
        </div>
    </div>

    <!-- Barra de selección -->
    <div class="selection-bar" id="selectionBar">
        <span><strong id="selectedCount">0</strong> seleccionadas</span>
        <button class="btn btn-secondary" onclick="deseleccionar()">Limpiar</button>
        <button class="btn btn-primary" onclick="generarExcel()" style="width: auto;">📄 Generar Excel</button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        let ordenes = [];
        let filtradas = [];
        let seleccionadas = new Set();
        let ubicaciones = [];
        let config = {};

        // Cargar config guardada
        const saved = localStorage.getItem('tn_config');
        if (saved) {
            const s = JSON.parse(saved);
            document.getElementById('storeId').value = s.storeId || '';
            document.getElementById('accessToken').value = s.accessToken || '';
            document.getElementById('defaultWeight').value = s.weight || 10001;
            document.getElementById('defaultAlto').value = s.alto || 10;
            document.getElementById('defaultAncho').value = s.ancho || 10;
            document.getElementById('defaultProfundidad').value = s.prof || 10;
        }

        // Cargar ubicaciones
        fetch('ubicaciones.json').then(r => r.json()).then(data => ubicaciones = data).catch(() => {});

        function conectarTienda() {
            config = {
                storeId: document.getElementById('storeId').value,
                accessToken: document.getElementById('accessToken').value,
                weight: parseInt(document.getElementById('defaultWeight').value) || 10001,
                alto: parseInt(document.getElementById('defaultAlto').value) || 10,
                ancho: parseInt(document.getElementById('defaultAncho').value) || 10,
                prof: parseInt(document.getElementById('defaultProfundidad').value) || 10
            };

            // Guardar config
            localStorage.setItem('tn_config', JSON.stringify(config));

            const btn = document.getElementById('btnConnect');
            btn.disabled = true;
            btn.innerHTML = '⏳ Conectando...';

            // Llamar a nuestra API serverless
            fetch(`/api/orders?storeId=${config.storeId}&accessToken=${config.accessToken}`)
            .then(r => {
                if (!r.ok) throw new Error('Error de conexión');
                return r.json();
            })
            .then(data => {
                if (data.error) throw new Error(data.error);
                
                ordenes = data;
                filtradas = [...ordenes];
                
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Conectado';
                document.getElementById('configPanel').classList.add('hidden');
                document.getElementById('ordersPanel').classList.remove('hidden');
                
                renderTabla();
                actualizarContadores();
                toast('✅ ' + ordenes.length + ' órdenes cargadas', 'success');
            })
            .catch(err => {
                toast('❌ ' + err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '🔌 Conectar y cargar órdenes';
            });
        }

        function renderTabla() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('tableContainer').classList.remove('hidden');
            
            const tbody = document.getElementById('ordersBody');
            tbody.innerHTML = '';
            
            filtradas.forEach(o => {
                const s = o.shipping_address || {};
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="checkbox" ${seleccionadas.has(o.id) ? 'checked' : ''} onchange="toggleOrden(${o.id})"></td>
                    <td><strong>#${o.number}</strong></td>
                    <td>${o.customer?.name || '-'}<br><small style="color:#888">${o.customer?.email || ''}</small></td>
                    <td>${s.address || ''} ${s.number || ''}<br><small style="color:#888">${s.city || ''}, ${s.province || ''}</small></td>
                    <td><span class="badge ${o.payment_status === 'paid' ? 'badge-success' : 'badge-warning'}">${o.payment_status === 'paid' ? 'Pagado' : 'Pendiente'}</span></td>
                    <td>$${parseFloat(o.total || 0).toLocaleString('es-AR')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function actualizarContadores() {
            document.getElementById('countAll').textContent = ordenes.length;
            document.getElementById('countPaid').textContent = ordenes.filter(o => o.payment_status === 'paid').length;
            document.getElementById('countPending').textContent = ordenes.filter(o => o.payment_status === 'pending').length;
        }

        function filtrar(tipo) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tipo === 'paid') filtradas = ordenes.filter(o => o.payment_status === 'paid');
            else if (tipo === 'pending') filtradas = ordenes.filter(o => o.payment_status === 'pending');
            else filtradas = [...ordenes];
            
            renderTabla();
        }

        function toggleOrden(id) {
            if (seleccionadas.has(id)) seleccionadas.delete(id);
            else seleccionadas.add(id);
            actualizarSeleccion();
        }

        function toggleAll() {
            const checked = document.getElementById('selectAll').checked;
            filtradas.forEach(o => checked ? seleccionadas.add(o.id) : seleccionadas.delete(o.id));
            renderTabla();
            actualizarSeleccion();
        }

        function deseleccionar() {
            seleccionadas.clear();
            document.getElementById('selectAll').checked = false;
            renderTabla();
            actualizarSeleccion();
        }

        function actualizarSeleccion() {
            document.getElementById('selectedCount').textContent = seleccionadas.size;
            document.getElementById('selectionBar').classList.toggle('visible', seleccionadas.size > 0);
        }

        function buscarUbicacion(cp, loc, prov) {
            cp = String(cp).trim();
            const matches = ubicaciones.filter(u => u.endsWith(' / ' + cp));
            if (!matches.length) return `${(prov || '').toUpperCase()} / ${(loc || '').toUpperCase()} / ${cp}`;
            for (const u of matches) if (loc && u.toUpperCase().includes(loc.toUpperCase())) return u;
            for (const u of matches) if (prov && u.toUpperCase().includes(prov.toUpperCase())) return u;
            return matches[0];
        }

        function generarExcel() {
            const sels = ordenes.filter(o => seleccionadas.has(o.id));
            if (!sels.length) return toast('❌ Seleccioná al menos una orden', 'error');

            const datos = [['Paquete Guardado', 'Peso (grs)', 'Alto (cm)', 'Ancho (cm)', 'Profundidad (cm)', 'Valor declarado ($ C/IVA)', 'Numero Interno', 'Nombre *', 'Apellido *', 'DNI *', 'Email *', 'Celular código *', 'Celular número *', 'Calle *', 'Número *', 'Piso', 'Departamento', 'Provincia / Localidad / CP *', 'Observaciones']];

            sels.forEach(o => {
                const s = o.shipping_address || {};
                const c = o.customer || {};
                
                const partes = (c.name || '').trim().split(/\s+/);
                const apellido = partes.length > 1 ? partes.pop() : '';
                const nombre = partes.join(' ');
                
                let tel = String(s.phone || c.phone || '').replace(/\D/g, '');
                if (tel.startsWith('54')) tel = tel.substring(2);
                if (tel.startsWith('9')) tel = tel.substring(1);
                const codigo = tel.startsWith('11') ? '11' : tel.substring(0, 3);
                const numero = tel.startsWith('11') ? tel.substring(2) : tel.substring(3);
                
                const dni = String(c.identification || '').replace(/\D/g, '').substring(0, 8);
                
                let numCalle = s.number || '0';
                if (['SN', 'S/N'].includes(String(numCalle).toUpperCase())) numCalle = '0';
                
                const ubi = buscarUbicacion(s.zipcode, s.city || s.locality, s.province);
                const obs = String(s.locality || '').replace(/-/g, ' ');

                datos.push(['', config.weight, config.alto, config.ancho, config.prof, Math.round(parseFloat(o.total || 0)), o.number, nombre, apellido, dni, c.email || '', codigo, numero, s.address || '', numCalle, s.floor || '', s.apartment || '', ubi, obs]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(datos);
            XLSX.utils.book_append_sheet(wb, ws, 'A domicilio');
            
            window.excelData = { wb, count: sels.length };
            
            document.getElementById('ordersPanel').classList.add('hidden');
            document.getElementById('selectionBar').classList.remove('visible');
            document.getElementById('successPanel').classList.remove('hidden');
            toast('✅ Excel generado con ' + sels.length + ' órdenes', 'success');
        }

        function descargarExcel() {
            if (!window.excelData) return;
            XLSX.writeFile(window.excelData.wb, `Andreani_${window.excelData.count}ordenes.xlsx`);
        }

        function volver() {
            document.getElementById('successPanel').classList.add('hidden');
            document.getElementById('ordersPanel').classList.remove('hidden');
            actualizarSeleccion();
        }

        function toast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast visible ' + type;
            setTimeout(() => t.classList.remove('visible'), 3000);
        }
    </script>
</body>
</html>
